<div class="robot-web-loader htmx-indicator" data-robot-loader aria-live="polite" aria-label="Generating details">
  <style>
    .robot-web-loader {
      display: none;
      width: min(100%, 720px);
      margin: 1rem auto;
      opacity: 0;
      transition: opacity 180ms ease-in;
    }

    .htmx-request .robot-web-loader,
    .htmx-request.robot-web-loader {
      display: block;
      opacity: 1;
      transform-origin: 50% 50%;
      animation: robot-web-loader-enter 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .robot-web-loader canvas {
      width: 100%;
      height: 360px;
      max-height: 52vh;
      min-height: 220px;
      background: #ffefc4;
      border: 2px solid rgba(40, 35, 25, 0.25);
      border-radius: 8px;
      display: block;
    }

    @keyframes robot-web-loader-enter {
      from {
        clip-path: inset(0 50% 0 50%);
        transform: scaleX(0.92);
        opacity: 0;
      }
      to {
        clip-path: inset(0 0 0 0);
        transform: scaleX(1);
        opacity: 1;
      }
    }
  </style>

  <canvas width="400" height="200" aria-label="Robot thinking animation"></canvas>

  <script>
    (() => {
      class RobotThinkingLoader {
        constructor(canvas, options = {}) {
          this.canvas = canvas;
          this.ctx = canvas.getContext("2d");
          this.background = options.background || "#ffefc4";
          this.line = options.line || "#2b271f";
          this.accent = options.accent || "#6a5d3f";
          this.isRunning = false;
          this.rafId = null;
          this.startTime = 0;
          this.lastTime = 0;
          this.lastBubbleChange = 0;
          this.bubbleIndex = 0;
          this.direction = 1;
          this.robotX = 0;
          this.scratchUntil = 0;
          this.nextScratchTime = 0;
          this.headScratchSide = 1;
          this.sayings = options.sayings || [
            "Usually this takes 30 seconds to 2 minutes. Please stand by, human.",
            "Clanking through possible ideas...",
            "Consulting ancient robot memory drums...",
            "Re-aligning my notion circuits...",
            "Searching for excellent and/or weird options...",
            "Rehearsing a dramatic reveal...",
            "Sorting the practical from the delightful...",
            "Engaging deep thunk mode...",
            "Assembling concepts with precision-ish...",
            "Running anti-boring calibration...",
            "Comparing inspiration vectors...",
            "Please ignore the harmless internal rattling..."
          ];
          this.resizeObserver = new ResizeObserver(() => this.resize());
          this.resizeObserver.observe(this.canvas);
          this.resize();
        }

        resize() {
          const rect = this.canvas.getBoundingClientRect();
          this.width = Math.round(rect.width || 0) || this.canvas.width || 400;
          this.height = Math.round(rect.height || 0) || this.canvas.height || 200;
          const dpr = window.devicePixelRatio || 1;
          const pixelWidth = Math.round(this.width * dpr);
          const pixelHeight = Math.round(this.height * dpr);
          if (this.canvas.width !== pixelWidth || this.canvas.height !== pixelHeight) {
            this.canvas.width = pixelWidth;
            this.canvas.height = pixelHeight;
          }
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (!this.robotX) this.robotX = this.width * 0.25;
        }

        start() {
          if (this.isRunning) return;
          this.isRunning = true;
          this.startTime = performance.now();
          this.lastTime = this.startTime;
          this.lastBubbleChange = this.startTime;
          this.scratchUntil = 0;
          this.nextScratchTime = this.startTime + 2500 + Math.random() * 2500;
          this.headScratchSide = Math.random() > 0.5 ? 1 : -1;
          this.loop(this.startTime);
        }

        stop() {
          this.isRunning = false;
          if (this.rafId) cancelAnimationFrame(this.rafId);
          this.rafId = null;
          this.drawStopped();
        }

        nextThought() {
          let next = this.bubbleIndex;
          while (next === this.bubbleIndex && this.sayings.length > 1) {
            next = Math.floor(Math.random() * this.sayings.length);
          }
          this.bubbleIndex = next;
        }

        loop = (now) => {
          if (!this.isRunning) return;
          const dt = Math.min(0.05, (now - this.lastTime) / 1000);
          const elapsed = (now - this.startTime) / 1000;
          this.lastTime = now;
          if (now - this.lastBubbleChange > 3600) {
            this.lastBubbleChange = now;
            this.nextThought();
          }
          this.update(dt, now);
          this.draw(elapsed, now);
          this.rafId = requestAnimationFrame(this.loop);
        };

        update(dt, now) {
          const margin = this.width * 0.18;
          const minX = margin;
          const maxX = this.width - margin;
          const speed = Math.max(24, this.width * 0.095);
          this.robotX += this.direction * speed * dt;
          if (this.robotX > maxX) {
            this.robotX = maxX;
            this.direction = -1;
          } else if (this.robotX < minX) {
            this.robotX = minX;
            this.direction = 1;
          }
          if (now >= this.nextScratchTime && now >= this.scratchUntil) {
            this.scratchUntil = now + 900 + Math.random() * 500;
            this.nextScratchTime = this.scratchUntil + 2500 + Math.random() * 3500;
            this.headScratchSide = Math.random() > 0.5 ? 1 : -1;
          }
        }

        clear() {
          this.ctx.clearRect(0, 0, this.width, this.height);
          this.ctx.fillStyle = this.background;
          this.ctx.fillRect(0, 0, this.width, this.height);
        }

        draw(elapsed, now) {
          this.clear();
          this.drawGround(elapsed);
          this.drawBubble(elapsed);
          this.drawRobot(elapsed, now, false);
        }

        drawStopped() {
          this.clear();
          this.drawGround(0);
          this.drawBubble(0, "Generation complete. Robot entering snack mode.");
          this.drawRobot(0, 0, true);
        }

        drawGround(elapsed) {
          const groundY = this.height * 0.78;
          this.ctx.save();
          this.ctx.strokeStyle = "rgba(43, 39, 31, 0.35)";
          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([8, 8]);
          this.ctx.lineDashOffset = -elapsed * 14;
          this.ctx.beginPath();
          this.ctx.moveTo(this.width * 0.06, groundY);
          this.ctx.lineTo(this.width * 0.94, groundY);
          this.ctx.stroke();
          this.ctx.restore();
        }

        drawBubble(elapsed, overrideText) {
          const ctx = this.ctx;
          const text = overrideText || this.sayings[this.bubbleIndex];
          const padding = 10;
          const fontSize = Math.max(11, Math.min(15, this.width / 35));
          const maxBubbleWidth = Math.min(this.width * 0.58, 360);
          const lines = this.wrapText(text, maxBubbleWidth - padding * 2, fontSize);
          const lineHeight = fontSize * 1.35;
          const bubbleW = Math.max(160, Math.min(maxBubbleWidth, this.longestLine(lines, fontSize) + padding * 2));
          const bubbleH = padding * 2 + lines.length * lineHeight;
          let bubbleX = this.robotX + this.direction * 38;
          if (this.direction < 0) bubbleX -= bubbleW;
          bubbleX = Math.max(10, Math.min(this.width - bubbleW - 10, bubbleX));
          const bubbleY = Math.max(10, this.height * 0.09 + Math.sin(elapsed * 2) * 2);

          ctx.save();
          ctx.lineWidth = 2;
          ctx.strokeStyle = this.line;
          ctx.fillStyle = "rgba(255, 248, 223, 0.95)";
          ctx.fillRect(bubbleX, bubbleY, bubbleW, bubbleH);
          ctx.strokeRect(bubbleX, bubbleY, bubbleW, bubbleH);
          const tailBaseX = bubbleX + bubbleW * (this.direction > 0 ? 0.22 : 0.78);
          const tailBaseY = bubbleY + bubbleH;
          const tailTipX = this.robotX + this.direction * 10;
          const tailTipY = this.height * 0.34;
          ctx.beginPath();
          ctx.moveTo(tailBaseX - 8, tailBaseY);
          ctx.lineTo(tailTipX, tailTipY);
          ctx.lineTo(tailBaseX + 8, tailBaseY);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = this.line;
          ctx.font = `${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
          ctx.textBaseline = "top";
          lines.forEach((line, i) => {
            ctx.fillText(line, bubbleX + padding, bubbleY + padding + i * lineHeight);
          });
          ctx.restore();
        }

        drawRobot(elapsed, now, stopped) {
          const ctx = this.ctx;
          const scale = Math.min(this.width / 400, this.height / 200);
          const groundY = this.height * 0.78;
          const x = this.robotX;
          const y = groundY - 60 * scale;
          const bob = stopped ? 0 : Math.sin(elapsed * 7) * 1.8 * scale;
          const walk = stopped ? 0 : Math.sin(elapsed * 7.2);
          const lookAtViewer = stopped || Math.sin(elapsed * 0.72) > 0.8;
          const dir = this.direction;
          const scratching = !stopped && now < this.scratchUntil;
          const scratchPhase = scratching ? Math.sin(elapsed * 20) : 0;

          ctx.save();
          ctx.translate(x, y + bob);
          ctx.scale(scale, scale);
          ctx.lineCap = "square";
          ctx.lineJoin = "miter";
          ctx.strokeStyle = this.line;
          ctx.fillStyle = "rgba(255, 248, 223, 0.22)";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(0, -50);
          ctx.lineTo(0, -64);
          ctx.stroke();
          ctx.strokeRect(-3, -70, 6, 6);
          ctx.fillRect(-26, -48, 52, 38);
          ctx.strokeRect(-26, -48, 52, 38);
          ctx.beginPath();
          ctx.moveTo(-26, -28);
          ctx.lineTo(26, -28);
          ctx.stroke();
          ctx.strokeRect(-23, -45, 3, 3);
          ctx.strokeRect(20, -45, 3, 3);
          ctx.strokeRect(-23, -16, 3, 3);
          ctx.strokeRect(20, -16, 3, 3);
          ctx.fillStyle = this.line;
          if (lookAtViewer) {
            ctx.fillRect(-13, -40, 6, 6);
            ctx.fillRect(7, -40, 6, 6);
            ctx.strokeRect(-12, -23, 24, 8);
            ctx.beginPath();
            for (const x of [-8, -4, 0, 4, 8]) {
              ctx.moveTo(x, -23);
              ctx.lineTo(x, -15);
            }
            ctx.stroke();
          } else {
            const eyeX = dir > 0 ? 9 : -15;
            ctx.fillRect(eyeX, -40, 7, 6);
            const mx = dir > 0 ? 4 : -16;
            ctx.strokeRect(mx, -23, 16, 7);
            ctx.beginPath();
            for (const x of [4, 8, 12]) {
              ctx.moveTo(mx + x, -23);
              ctx.lineTo(mx + x, -16);
            }
            ctx.stroke();
          }
          ctx.strokeRect(-6, -10, 12, 10);
          ctx.fillStyle = "rgba(255, 248, 223, 0.18)";
          ctx.fillRect(-22, 0, 44, 46);
          ctx.strokeRect(-22, 0, 44, 46);
          ctx.strokeRect(-12, 9, 24, 18);
          ctx.strokeRect(-16, 31, 32, 8);
          ctx.beginPath();
          ctx.moveTo(-18, 14); ctx.lineTo(18, 14);
          ctx.moveTo(-18, 30); ctx.lineTo(18, 30);
          ctx.stroke();
          ctx.fillStyle = this.accent;
          const led = Math.floor(elapsed * 4) % 3;
          for (let i = 0; i < 3; i++) {
            const lx = -7 + i * 7;
            if (i === led && !stopped) ctx.fillRect(lx, 13, 4, 4);
            else ctx.strokeRect(lx, 13, 4, 4);
          }
          if (scratching && this.headScratchSide < 0) {
            this.segment(-22, 10, -31, -2, -20, -20 + scratchPhase * 2);
            ctx.strokeRect(-23, -23 + scratchPhase * 2, 7, 7);
          } else {
            this.segment(-22, 10, -36, 17 + walk * 4, -31, 36 - walk * 5);
            ctx.strokeRect(-34, 35 - walk * 5, 7, 7);
          }
          if (scratching && this.headScratchSide > 0) {
            this.segment(22, 10, 31, -2, 20, -20 + scratchPhase * 2);
            ctx.strokeRect(16, -23 + scratchPhase * 2, 7, 7);
          } else {
            this.segment(22, 10, 36, 17 - walk * 4, 31, 36 + walk * 5);
            ctx.strokeRect(27, 35 + walk * 5, 7, 7);
          }
          this.segment(-11, 46, -18 + walk * 7, 64, -28 + walk * 11, 79);
          this.segment(11, 46, 18 - walk * 7, 64, 28 - walk * 11, 79);
          ctx.strokeRect(-35 + walk * 11, 78, 18, 6);
          ctx.strokeRect(17 - walk * 11, 78, 18, 6);
          ctx.restore();
        }

        segment(x1, y1, x2, y2, x3, y3) {
          this.ctx.beginPath();
          this.ctx.moveTo(x1, y1);
          this.ctx.lineTo(x2, y2);
          this.ctx.lineTo(x3, y3);
          this.ctx.stroke();
        }

        wrapText(text, maxWidth, fontSize) {
          this.ctx.font = `${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
          const lines = [];
          let line = "";
          for (const word of text.split(/\s+/)) {
            const test = line ? `${line} ${word}` : word;
            if (this.ctx.measureText(test).width > maxWidth && line) {
              lines.push(line);
              line = word;
            } else {
              line = test;
            }
          }
          if (line) lines.push(line);
          return lines;
        }

        longestLine(lines, fontSize) {
          this.ctx.font = `${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
          return Math.max(...lines.map(line => this.ctx.measureText(line).width), 0);
        }
      }

      const loaderElements = document.querySelectorAll(".robot-web-loader[data-robot-loader]:not([data-robot-ready])");
      for (const loaderElement of loaderElements) {
        loaderElement.dataset.robotReady = "true";
        const loader = new RobotThinkingLoader(loaderElement.querySelector("canvas"));
        const observer = new IntersectionObserver((entries) => {
          if (entries.some(entry => entry.isIntersecting)) loader.start();
          else loader.stop();
        });
        observer.observe(loaderElement);
      }
    })();
  </script>
</div>
