<div class="botanical-spider-loader htmx-indicator" data-spider-loader aria-live="polite" aria-label="Generating">
  <style>
    .botanical-spider-loader {
      display: none;
      width: min(100%, 460px);
      margin: 1rem auto;
      opacity: 0;
      transition: opacity 180ms ease-in;
    }

    .htmx-request .botanical-spider-loader,
    .htmx-request.botanical-spider-loader {
      display: block;
      opacity: 1;
      transform-origin: 50% 50%;
      animation: botanical-spider-loader-enter 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .botanical-spider-loader__plate {
      position: relative;
      border: 1px solid rgba(36, 24, 15, 0.22);
      border-radius: 8px;
      background: rgba(255, 249, 226, 0.76);
      box-shadow: 0 18px 42px rgba(36, 24, 15, 0.14);
      padding: 14px;
      overflow: hidden;
    }

    .botanical-spider-loader__plate::before,
    .botanical-spider-loader__plate::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(36, 24, 15, 0.12);
      border-radius: 6px;
      pointer-events: none;
    }

    .botanical-spider-loader__plate::after {
      inset: 15px;
      border-style: dotted;
      opacity: 0.6;
    }

    .botanical-spider-loader__canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 6px;
      overflow: hidden;
      background: #ffefc4;
    }

    .botanical-spider-loader canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .botanical-spider-loader__marquee-shell {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      height: 32px;
      overflow: hidden;
      border-top: 1px solid rgba(36, 24, 15, 0.18);
      border-bottom: 1px solid rgba(36, 24, 15, 0.18);
      background: rgba(255, 239, 196, 0.82);
      backdrop-filter: blur(3px);
    }

    .botanical-spider-loader__marquee-track {
      display: inline-flex;
      align-items: center;
      gap: 32px;
      height: 100%;
      white-space: nowrap;
      will-change: transform;
      animation: botanical-spider-loader-crawl 42s linear infinite;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(36, 24, 15, 0.72);
    }

    .botanical-spider-loader__marquee-track span::before {
      content: "*";
      margin-right: 32px;
      opacity: 0.55;
    }

    @keyframes botanical-spider-loader-crawl {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes botanical-spider-loader-enter {
      from {
        clip-path: inset(0 50% 0 50%);
        transform: scaleX(0.92);
        opacity: 0;
      }
      to {
        clip-path: inset(0 0 0 0);
        transform: scaleX(1);
        opacity: 1;
      }
    }
  </style>

  <div class="botanical-spider-loader__plate">
    <div class="botanical-spider-loader__canvas-wrap">
      <canvas width="400" height="400"></canvas>
      <div class="botanical-spider-loader__marquee-shell" aria-hidden="true">
        <div class="botanical-spider-loader__marquee-track"></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const loaders = document.querySelectorAll('.botanical-spider-loader[data-spider-loader]:not([data-spider-ready])');

      for (const loader of loaders) {
        loader.dataset.spiderReady = 'true';

        const canvas = loader.querySelector('canvas');
        const ctx = canvas.getContext('2d');
        const marqueeTrack = loader.querySelector('.botanical-spider-loader__marquee-track');

        const marqueeLines = [
          'Working on it - expect roughly 30-120 seconds of tasteful computation',
          'The spider has consulted the dew and resumed weaving',
          'Silk deployed, ideas being gently trapped',
          'Please admire the linework while the machine thinks',
          'A tiny arachnid is indexing the possible futures',
          'This may take a minute, but the web is becoming persuasive',
          'Between 30 seconds and 2 minutes, unless the muse is dramatic',
          'Loading: botanical patience, procedural silk, one nervous leg at a time',
          'Your answer is being wrapped in archival-grade cobweb',
          'Dense web, dense thoughts, delicate outcome pending'
        ];

        marqueeTrack.innerHTML = [...marqueeLines, ...marqueeLines]
          .map(line => `<span>${line}</span>`)
          .join('');

        const TAU = Math.PI * 2;
        const state = {
          running: false,
          raf: null,
          last: performance.now(),
          time: 0,
          weaveTimer: 0,
          strands: [],
          anchorCount: 18,
          maxStrands: 720,
          spider: {
            radial: 0,
            ring: 0.25,
            targetRadial: 0,
            targetRing: 0.25,
            pause: 0
          }
        };

        function fitCanvas() {
          const rect = canvas.getBoundingClientRect();
          const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          const w = Math.max(1, Math.round((rect.width || 400) * dpr));
          const h = Math.max(1, Math.round((rect.height || 400) * dpr));

          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          return { w: w / dpr, h: h / dpr };
        }

        function rand(min, max) { return min + Math.random() * (max - min); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function wrapAnchor(a) { return ((a % state.anchorCount) + state.anchorCount) % state.anchorCount; }
        function snapRing(v) { return clamp(Math.round(v * 18) / 18, 0.06, 1.04); }
        function shortestAnchorDelta(from, to) {
          return ((to - from + state.anchorCount * 1.5) % state.anchorCount) - state.anchorCount * 0.5;
        }
        function quadPoint(p0, p1, p2, t) {
          const mt = 1 - t;
          return {
            x: mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x,
            y: mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y
          };
        }
        function webPoint(radialIndex, ring, dims) {
          const cx = dims.w * 0.5;
          const cy = dims.h * 0.43;
          const radius = Math.min(dims.w, dims.h) * 0.42;
          const angle = -Math.PI / 2 + (radialIndex / state.anchorCount) * TAU;
          const ovalX = Math.cos(angle) * radius * ring * 1.02;
          const ovalY = Math.sin(angle) * radius * ring * 0.82;
          const wobble = Math.sin(radialIndex * 1.91 + ring * 8.4) * radius * 0.015 * ring;

          return {
            x: cx + ovalX + Math.cos(angle + Math.PI / 2) * wobble,
            y: cy + ovalY + Math.sin(angle + Math.PI / 2) * wobble
          };
        }
        function strandEnd(strand) {
          return { radial: strand.b ?? strand.a, ring: strand.r2 };
        }
        function addStrand() {
          const startA = wrapAnchor(Math.round(state.spider.radial));
          const startR = snapRing(state.spider.ring);
          const allowCross = state.strands.length > 140;
          const kindRoll = Math.random();
          let strand;

          if (kindRoll < 0.50) {
            const step = Math.random() < 0.82 ? 1 : 2;
            const dir = Math.random() < 0.5 ? -1 : 1;
            strand = { kind: 'arc', a: startA, b: wrapAnchor(startA + dir * step), r1: startR, r2: snapRing(startR + rand(-0.03, 0.03)), progress: 0, opacity: rand(0.28, 0.62), bow: rand(-0.08, 0.08) };
          } else if (kindRoll < (allowCross ? 0.78 : 1.0)) {
            let endR = snapRing(startR + rand(-0.28, 0.28));
            if (Math.abs(endR - startR) < 0.08) {
              endR = snapRing(startR + (Math.random() < 0.5 ? -0.16 : 0.16));
            }
            strand = { kind: 'radial', a: startA, r1: startR, r2: endR, progress: 0, opacity: rand(0.20, 0.42), bow: rand(-0.04, 0.04) };
          } else {
            const span = Math.floor(rand(2, 5));
            const dir = Math.random() < 0.5 ? -1 : 1;
            strand = { kind: 'cross', a: startA, b: wrapAnchor(startA + dir * span), r1: startR, r2: snapRing(startR + rand(-0.10, 0.10)), progress: 0, opacity: rand(0.13, 0.24), bow: rand(-0.08, 0.08) };
          }

          state.strands.push(strand);
          if (state.strands.length > state.maxStrands) state.strands.shift();

          const end = strandEnd(strand);
          state.spider.targetRadial = end.radial;
          state.spider.targetRing = end.ring;
          state.spider.pause = rand(0.03, 0.11);
        }
        function drawLeaf(x, y, size, angle) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(size * 0.65, -size * 0.25, size * 0.85, size * 0.25, 0, size * 0.72);
          ctx.bezierCurveTo(-size * 0.85, size * 0.25, -size * 0.65, -size * 0.25, 0, 0);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, size * 0.68);
          ctx.stroke();
          ctx.restore();
        }
        function drawBotanicalBackground(dims) {
          ctx.clearRect(0, 0, dims.w, dims.h);
          ctx.fillStyle = '#ffefc4';
          ctx.fillRect(0, 0, dims.w, dims.h);

          ctx.save();
          ctx.globalAlpha = 0.18;
          ctx.strokeStyle = '#24180f';
          ctx.lineWidth = 1;

          const stems = [
            [0.12, 0.88, 0.20, 0.62, 0.25, 0.42],
            [0.88, 0.83, 0.78, 0.60, 0.72, 0.36],
            [0.08, 0.28, 0.18, 0.34, 0.26, 0.24],
            [0.93, 0.23, 0.82, 0.34, 0.76, 0.20]
          ];

          for (const s of stems) {
            ctx.beginPath();
            ctx.moveTo(s[0] * dims.w, s[1] * dims.h);
            ctx.bezierCurveTo(s[2] * dims.w, s[3] * dims.h, s[4] * dims.w, s[5] * dims.h, s[4] * dims.w, s[5] * dims.h);
            ctx.stroke();
            drawLeaf(s[2] * dims.w, s[3] * dims.h, 16, s[0] < 0.5 ? -0.8 : 0.8);
            drawLeaf(s[4] * dims.w, s[5] * dims.h, 12, s[0] < 0.5 ? 0.65 : -0.65);
          }

          ctx.restore();
          ctx.save();
          ctx.globalAlpha = 0.16;
          ctx.strokeStyle = '#24180f';
          ctx.strokeRect(dims.w * 0.06, dims.h * 0.06, dims.w * 0.88, dims.h * 0.88);
          ctx.restore();
        }
        function strandPoints(strand, dims) {
          const p1 = webPoint(strand.a, strand.r1, dims);
          const p2 = strand.kind === 'radial' ? webPoint(strand.a, strand.r2, dims) : webPoint(strand.b, strand.r2, dims);
          const mx = (p1.x + p2.x) / 2;
          const my = (p1.y + p2.y) / 2;
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len;
          const ny = dx / len;
          const curve = strand.bow * Math.min(dims.w, dims.h);
          const control = { x: mx + nx * curve, y: my + ny * curve };
          return { p1, control, p2 };
        }
        function drawStrand(strand, dims) {
          const tMax = clamp(strand.progress ?? 1, 0, 1);
          if (tMax <= 0) return;

          const { p1, control, p2 } = strandPoints(strand, dims);
          const alpha = strand.opacity * clamp(tMax * 1.6, 0.2, 1);
          const steps = Math.max(4, Math.ceil(24 * tMax));

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = '#24180f';
          ctx.lineWidth = Math.max(0.55, Math.min(dims.w, dims.h) / 540);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          for (let i = 1; i <= steps; i++) {
            const t = (i / steps) * tMax;
            const q = quadPoint(p1, control, p2, t);
            ctx.lineTo(q.x, q.y);
          }
          ctx.stroke();
          ctx.restore();
        }
        function drawSpider(dims) {
          if (state.spider.pause <= 0) {
            const targetDelta = shortestAnchorDelta(state.spider.radial, state.spider.targetRadial);
            state.spider.radial += targetDelta * 0.035;
            state.spider.ring = lerp(state.spider.ring, state.spider.targetRing, 0.040);
          }

          const p = webPoint(wrapAnchor(state.spider.radial), state.spider.ring, dims);
          const scale = Math.min(dims.w, dims.h) / 400;
          const walk = Math.sin(state.time * 7.5) * 0.7;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((state.spider.radial / state.anchorCount) * TAU + Math.PI / 2);
          ctx.strokeStyle = '#24180f';
          ctx.fillStyle = '#24180f';
          ctx.lineWidth = 1.3 * scale;
          ctx.lineCap = 'round';
          ctx.save();
          ctx.globalAlpha = 0.38;
          ctx.beginPath();
          ctx.moveTo(0, -3 * scale);
          ctx.lineTo(0, -34 * scale);
          ctx.stroke();
          ctx.restore();

          for (let side of [-1, 1]) {
            for (let i = 0; i < 4; i++) {
              const y = (-7 + i * 4.2) * scale;
              const sweep = (10 + i * 1.8 + walk * (i % 2 ? -1 : 1)) * scale;
              ctx.beginPath();
              ctx.moveTo(side * 3.2 * scale, y);
              ctx.lineTo(side * sweep, y - (5 - i) * scale);
              ctx.lineTo(side * (sweep + 7) * scale, y + (i - 1) * scale);
              ctx.stroke();
            }
          }

          ctx.beginPath();
          ctx.ellipse(0, 3 * scale, 5.4 * scale, 7.2 * scale, 0, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(0, -6 * scale, 4.2 * scale, 4.8 * scale, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        function draw(dims) {
          drawBotanicalBackground(dims);
          ctx.save();
          ctx.globalAlpha = 0.05;
          ctx.fillStyle = '#24180f';
          ctx.beginPath();
          ctx.ellipse(dims.w * 0.5, dims.h * 0.45, dims.w * 0.40, dims.h * 0.33, 0, 0, TAU);
          ctx.fill();
          ctx.restore();

          for (const strand of state.strands) drawStrand(strand, dims);
          drawSpider(dims);

          ctx.save();
          ctx.globalAlpha = 0.58;
          ctx.fillStyle = '#24180f';
          ctx.font = `${Math.max(10, dims.w * 0.027)}px ui-monospace, monospace`;
          ctx.textAlign = 'center';
          ctx.fillText('Aranea computatrix - web density increasing', dims.w * 0.5, dims.h * 0.885);
          ctx.restore();
        }
        function reset() {
          state.time = 0;
          state.weaveTimer = 0;
          state.strands = [];
          state.spider.radial = 0;
          state.spider.ring = 0.25;
          state.spider.targetRadial = 0;
          state.spider.targetRing = 0.25;
          state.spider.pause = 0;

          for (let i = 0; i < state.anchorCount; i += 2) {
            state.strands.push({ kind: 'radial', a: i, r1: 0.08, r2: 0.98, progress: 1, opacity: 0.18, bow: 0 });
          }

          for (let r = 0.22; r <= 0.9; r += 0.19) {
            for (let i = 0; i < state.anchorCount; i += 3) {
              state.strands.push({ kind: 'arc', a: i, b: wrapAnchor(i + 1), r1: snapRing(r), r2: snapRing(r + 0.01), progress: 1, opacity: 0.22, bow: 0 });
            }
          }

          draw(fitCanvas());
        }
        function tick(now) {
          const rawDt = Math.min(0.04, (now - state.last) / 1000 || 0.016);
          const dt = rawDt * 0.5;
          state.last = now;
          state.time += dt;
          state.weaveTimer += dt;
          state.spider.pause = Math.max(0, state.spider.pause - dt);

          const dims = fitCanvas();
          const interval = Math.max(0.044, 0.38 - state.strands.length * 0.00044);
          while (state.weaveTimer > interval) {
            state.weaveTimer -= interval;
            addStrand();
          }

          for (const s of state.strands) {
            s.progress = Math.min(1, (s.progress ?? 0) + dt * 1.15);
          }

          draw(dims);
          if (state.running) state.raf = requestAnimationFrame(tick);
        }
        function start() {
          if (state.running) return;
          state.running = true;
          state.last = performance.now();
          state.raf = requestAnimationFrame(tick);
          marqueeTrack.style.animationPlayState = 'running';
        }
        function stop() {
          state.running = false;
          if (state.raf) cancelAnimationFrame(state.raf);
          state.raf = null;
          marqueeTrack.style.animationPlayState = 'paused';
        }

        window.addEventListener('resize', () => draw(fitCanvas()));
        reset();

        const observer = new IntersectionObserver((entries) => {
          if (entries.some(entry => entry.isIntersecting)) {
            reset();
            start();
          } else {
            stop();
          }
        });
        observer.observe(loader);
      }
    })();
  </script>
</div>
