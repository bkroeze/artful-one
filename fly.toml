app = "artful-one"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile.flyio"

[env]
  DJANGO_DEBUG = "false"
  DATABASE_URL = "sqlite:////data/artful-one.db"
  STATIC_ROOT = "/data/staticfiles"
  MEDIA_ROOT = "/data/media"
  FILEDROP_BASE_DIR = "/data/filedrop_files"
  CSRF_TRUSTED_ORIGINS = "https://artful.one,https://artful-one.fly.dev"
  SESSION_COOKIE_SECURE = "true"
  ALLOWED_HOSTS = "artful.one,artful-one.fly.dev,*"
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  WEB_CONCURRENCY = "1"

[[mounts]]
  source = "artful_one_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
