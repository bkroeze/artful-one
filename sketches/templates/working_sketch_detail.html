<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ sketch.title }}</title>
  {% if sketch.sketch_type == "d3" %}<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>{% endif %}
  {% if sketch.sketch_type == "processing" %}<script src="https://cdn.jsdelivr.net/npm/processing-js@1.6.6/processing.min.js"></script>{% endif %}
</head>
<body>
{{ sketch_body|safe }}
{{ startup_js|json_script:"sketch-startup-source" }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const root = document.getElementById("sketch-root");
    const source = JSON.parse(document.getElementById("sketch-startup-source").textContent);
    {% if sketch.sketch_type == "processing" %}
    const canvas = root.tagName === "CANVAS"
      ? root
      : root.querySelector("canvas") || root.appendChild(document.createElement("canvas"));
    const start = new Function("processing", "p", "root", source);
    new Processing(canvas, function (processing) {
      start(processing, processing, root);
    });
    {% elif sketch.sketch_type == "d3" %}
    new Function("root", "d3", source)(root, window.d3);
    {% else %}
    new Function("root", source)(root);
    {% endif %}
  });
</script>
</body>
</html>
